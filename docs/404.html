<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta http-equiv="refresh" content="0;url=https://sontienbao-v7.vercel.app/">

  <title>Sơn Tiến Bảo đã chuyển địa chỉ</title>
  <style>
    :root{color-scheme:light;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:#f6f4ef;color:#10242e}
    main{max-width:520px;padding:40px;border:1px solid #e6e2d9;border-radius:24px;background:#fff;box-shadow:0 18px 60px #10242e12}
    span{color:#d52e29;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
    h1{margin:14px 0;font-size:clamp(28px,6vw,42px);line-height:1.12}
    p{color:#54636b;line-height:1.65}
    a{display:inline-block;margin-top:12px;padding:14px 20px;border-radius:12px;background:#cf2f29;color:#fff;font-weight:700;text-decoration:none}
    a:focus-visible{outline:3px solid #10242e;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <span>Sơn Tiến Bảo</span>
    <h1>Website đã chuyển sang địa chỉ mới</h1>
    <p>Trang sẽ tự mở sau giây lát. Nếu không được, hãy dùng nút bên dưới.</p>
