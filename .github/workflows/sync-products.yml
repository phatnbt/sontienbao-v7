name: Sync iTop products

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync_products.py'
      - 'default-data.js'
      - '.github/workflows/sync-products.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync products from sontienbao.com
        run: python scripts/sync_products.py

      - name: Commit synced data
        shell: bash
        run: |
          if git diff --quiet -- synced-products.js; then
            echo "No product changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add synced-products.js
          git commit -m "Sync products from iTop"
          git push
