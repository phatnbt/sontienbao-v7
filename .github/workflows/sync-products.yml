name: Sync website products

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync_products.py'
      - 'scripts/sync_technical.py'
      - 'scripts/sync_full_calculator_catalog.py'
      - 'scripts/sync_full_calculator_catalog_fast.py'
      - 'scripts/sync_full_calculator_catalog_resilient.py'
      - 'scripts/finalize_calculator_catalog.py'
      - 'scripts/patch_calculator.py'
      - 'scripts/patch_calculator_v5.py'
      - 'scripts/fix_calculator_v5_syntax.py'
      - 'scripts/prefer_verified_calculator_catalog.py'
      - 'scripts/sanitize_public_copy.py'
      - 'sync-products.js'
      - 'default-data.js'
      - '.github/workflows/sync-products.yml'
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: sontienbao-product-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sync dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Sync products from sontienbao.com
        run: python scripts/sync_products.py

      - name: Sync technical calculator data
        run: python scripts/sync_technical.py

      - name: Discover resilient multi-brand Calculator catalog
        run: python scripts/sync_full_calculator_catalog_resilient.py

      - name: Finalize verified product families and package prices
        run: python scripts/finalize_calculator_catalog.py

      - name: Apply Calculator base upgrade
        run: python scripts/patch_calculator.py

      - name: Apply Calculator V5 full catalog UI
        run: python scripts/patch_calculator_v5.py

      - name: Normalize Calculator V5 rendering
        run: python scripts/fix_calculator_v5_syntax.py

      - name: Prefer verified Calculator family catalog
        run: python scripts/prefer_verified_calculator_catalog.py

      - name: Sanitize customer-facing calculator copy
        run: python scripts/sanitize_public_copy.py

      - name: Validate app JavaScript
        run: node --check app.js

      - name: Commit synced data
        shell: bash
        run: |
          if git diff --quiet -- synced-products.js app.js styles.css; then
            echo "No product or calculator changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add synced-products.js app.js styles.css
          git commit -m "Sync resilient verified Calculator V5 catalog"
          git push origin HEAD:main
